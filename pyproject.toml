[project]
name = "orgmcp"
version = "0.1.0"
description = "A file-based organization of agents, run over MCP"
readme = "README.md"
authors = [
    { name = "Amin Alizadeh", email = "achieveramin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pyyaml==6.0.2",
    "textual==8.2.8",
]

[project.scripts]
orgmcp = "orgmcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==8.*",
]

[tool.hatch.build.targets.wheel]
# Colocated tests (src/orgmcp/**/tests/) are development files: never shipped.
exclude = ["**/tests/**"]

[tool.hatch.build.targets.wheel.force-include]
"skills/orgmcp/SKILL.md" = "orgmcp/_skill/SKILL.md"

[tool.pytest.ini_options]
# Tests live in tests/ (cross-feature, end-to-end, golden) and next to the code in src/orgmcp/**/tests/ (see README, "Test").
# The shared fixtures and hooks are in the root conftest.py, so they reach both places; tests/ is on sys.path so tests can
# import the helper modules that live there (fake_agent, kiro_sandbox, dash_fixtures, ...).
testpaths = ["tests", "src/orgmcp"]
pythonpath = ["tests"]
markers = [
    "integration: uses the real kiro-cli / a real LLM; skipped unless --run-integration (or ORGMCP_RUN_INTEGRATION=1)",
    "architecture: structural checks of the refactor (tests/architecture); deselect with -m 'not architecture' for a quick loop",
]

# ---------------------------------------------------------------------------------------------------------------------
# Static checks (dev tooling, pinned in [dependency-groups]). One command runs everything: scripts/check.sh
# (pytest, which includes tests/test_static_checks.py, + mypy + lint-imports). README, "Test".
# ---------------------------------------------------------------------------------------------------------------------

[tool.mypy]
# STRICT CHECKING, PACKAGE BY PACKAGE. scripts/static_checks.py checks with `strict = true` every package directory of src/orgmcp
# (a directory with __init__.py: kernel, the features, the entry points, app) -- so a new package is strict from its first commit and
# no step edits this file -- plus the modules listed in `packages` below (to make a flat legacy module strict early; empty today).
# Everything else is only *followed* (its types are used, its errors are not reported), so today's untyped modules never fail the run.
# Run it with `uv run python scripts/static_checks.py mypy` (nothing to check yet is a no-op that proves mypy runs).
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
follow_imports = "silent"
packages = ["orgmcp.kernel"]

[[tool.mypy.overrides]]
# R10: no explicit `Any` in the public surface (api.py) of a refactored package. `JsonObject = dict[str, object]` replaces dict[str, Any].
module = ["orgmcp.*.api"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
# Colocated tests and the in-memory fakes use pytest fixtures/marks, which are untyped decorators.
module = ["orgmcp.*.tests.*", "orgmcp.*.testing"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# The builder is a registry keyed by Protocol classes (`b.get(Clock)`): mypy refuses a Protocol where `type[T]` is expected unless
# this check is off (its documented remedy). Only the composition root has such a registry.
module = ["orgmcp.app", "orgmcp.app.*"]
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
# PyYAML ships no type stubs and the stubs package is deliberately not a dev dependency (exact pins only):
# a strict package wraps yaml behind its own typed function instead of letting Any leak through its API.
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.importlinter]
# HAND-WRITTEN CONTRACTS for the flat legacy modules (they disappear with the modules). The contracts of the architecture
# (docs/refactor-principles.md, "Enforcement": layers entry points -> features -> kernel; no import of another package's `_` modules;
# no cycles between features; the kernel imports nothing; no feature imports the Org facade; frameworks at the edge) are GENERATED
# from tests/architecture/graph.py and the packages that exist: `uv run python -m tests.architecture.lint` writes .importlinter
# (git-ignored) and runs it together with this section. To add a hand-written contract append a `[[tool.importlinter.contracts]]` block
# below: a `name`, a `type` (layers, forbidden, independence, acyclic_siblings ...) and its modules; it must pass before the commit.
# Docs: import-linter.readthedocs.io. (A plain `lint-imports` reads .importlinter when it exists: use `lint` or static_checks.py.)
root_package = "orgmcp"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "The library does not import the entry points (cli, mcp server, dashboard)"
type = "forbidden"
source_modules = [
    "orgmcp.blueprint", "orgmcp.blueprint_examples", "orgmcp.core", "orgmcp.dashboard_data", "orgmcp.dashboard_events",
    "orgmcp.health", "orgmcp.observe", "orgmcp.progress", "orgmcp.review", "orgmcp.scheduler", "orgmcp.services",
    "orgmcp.skill", "orgmcp.telemetry", "orgmcp.templates", "orgmcp.upgrade",
]
forbidden_modules = ["orgmcp.cli", "orgmcp.cli_obs", "orgmcp.server", "orgmcp.dashboard"]

[[tool.importlinter.contracts]]
name = "orgmcp.templates is a leaf: it imports nothing else from orgmcp"
type = "forbidden"
source_modules = ["orgmcp.templates"]
forbidden_modules = [
    "orgmcp.blueprint", "orgmcp.blueprint_examples", "orgmcp.cli", "orgmcp.cli_obs", "orgmcp.core", "orgmcp.dashboard",
    "orgmcp.dashboard_data", "orgmcp.dashboard_events", "orgmcp.health", "orgmcp.observe", "orgmcp.progress",
    "orgmcp.review", "orgmcp.scheduler", "orgmcp.server", "orgmcp.services", "orgmcp.skill", "orgmcp.telemetry",
    "orgmcp.upgrade",
]
