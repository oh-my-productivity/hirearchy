[project]
name = "orgmcp"
version = "0.1.0"
description = "A file-based organization of agents, run over MCP"
readme = "README.md"
authors = [
    { name = "Amin Alizadeh", email = "achieveramin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pyyaml==6.0.2",
]

[project.scripts]
orgmcp = "orgmcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==8.*",
]

[tool.hatch.build.targets.wheel.force-include]
"skills/orgmcp/SKILL.md" = "orgmcp/_skill/SKILL.md"
