# A research org, as the assistant would propose it after eliciting the needs.
#   hirearchy plan examples/blueprint-research.yaml     # validate + print the plan
#   hirearchy apply examples/blueprint-research.yaml    # create the agents and give the first task
mission: >
  Produce a sourced competitor analysis of five self-hosted note-taking apps for a small team choosing one.
needs:
  scope: "Obsidian, Logseq, Joplin, Trilium and AnyType only; self-hosting, licensing, sync/E2EE, mobile support, extensibility."
  deliverable:
    description: Competitor analysis with a comparison table and a closing "Where we can win" section marked as our assessment
    format: markdown
    max_words: 1500
    path: ~/deliverables/competitors.md
  quality_bar: Every factual claim cites the page that states it; opinions are labelled as judgement, without citations; current facts (versions, licenses) come from the live source.
  sources: Web access to official sites, repositories and docs; a source URL per claim.
  budget_runs: 25   # plan: 22 runs; researcher 4, writer 3 and factcheck 3 are handed down (each includes its rework / re-check run), the lead keeps 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}   # same model for both tiers; set a cheaper cheap id only if the user asks for one
  model_policy: one model for all (claude-sonnet-5.5 for every agent; a cheaper drafting model only if the user asks, with the lead and the fact-check staying strong)
  review: true   # independent fact-check by someone who did not write the report
  approval: Approve this plan before anything is created or started; ask before spending beyond the budget.
  progress: One line when I ask; tell me when it is done. No digging through files.
agents:
  - name: lead
    template: manager
    role: Research lead
    model: strong   # if a cheaper drafting model is ever set, the lead stays strong: a cheap lead misroutes rework and wastes runs
    children:
      - {name: researcher, template: researcher, scale: 1}
      - {name: writer, template: writer}
      - {name: factcheck, template: fact-checker}
task:
  to: lead
  title: Competitor analysis of five self-hosted note-taking apps
  goal: >
    Research Obsidian, Logseq, Joplin, Trilium and AnyType, write the analysis, have the claims independently
    fact-checked, apply the required corrections, and report the final file.
  acceptance:
    - Covers exactly Obsidian, Logseq, Joplin, Trilium and AnyType, and no other app.
    - At most 1500 words as counted by read.
    - Contains a comparison table with one row per app and a final section titled "Where we can win" that is marked as our assessment (judgement).
    - Every sentence with a number, name, version, license, price, date or "no/only/all" is a factual claim and cites the URL of the page that states it; the fact-checker fetched that page and quoted the sentence.
    - The "Where we can win" section is judgement. It has no citations or new facts and rests only on claims verified elsewhere in the document.
    - "The fact-checker's final coverage line reads 'n of m factual claims verified' with n = m (none wrong, unsupported or not-checkable) and 'each resting on verified facts: yes' for its judgement statements, and the writer applied every required change."
    - The final report names the path of the deliverable inside the organization, and pastes that coverage line verbatim.
