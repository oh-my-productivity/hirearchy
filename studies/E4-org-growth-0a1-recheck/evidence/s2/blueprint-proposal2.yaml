mission: >
  Each week, turn the notes of one team meeting into a short memo that says what was decided and who does what.
  The memo is written only from the user's own meeting notes, for the user's team.
needs:
  kind: writing
  scope: "One memo per request, from the one meeting-notes file named in the request. It lists the decisions and the action items (everyone who said they would do something, labelled ACTION or not). It leaves out discussion, background and anything not in the notes."
  inputs:
    - /tmp/hirearchy-e4-s2-1792698851/notes
  quality_bar: Every decision and every commitment in the notes file appears in the memo; nothing appears that is not in the notes.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 15
  models: {cheap: claude-haiku-4.5, strong: claude-sonnet-4.6}
  model_policy: "lead and reviewer on claude-sonnet-4.6; every other agent on claude-haiku-4.5 (the user's choice, to keep it cheap)"
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        template: writer
        model: cheap
        tools: [read]
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One short memo (decisions and action items) from one weekly meeting-notes file
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, e.g. 2026-10-19.md
        required: true
    acceptance:
      - "Uses only the notes file named in the request."
      - "At most 400 words as counted by read."
      - "A markdown memo with a section titled Decisions (a list) and a section titled Action items (a table)."
      - "Decisions lists every decision recorded in the notes, including small ones such as meeting logistics."
      - "The Action items table has exactly the columns Owner | Action | Due, with one row for every commitment in the notes, including informal ones written in prose and not labelled ACTION (anyone who said they would do something)."
      - "Due is an ISO date (YYYY-MM-DD). A vague or relative deadline (for example 'next week', 'by Friday') is turned into a date computed from the meeting date only when it identifies one exact calendar day; otherwise Due is 'none'. A commitment with no deadline has Due 'none'."
      - "Every decision, owner, action and date is traceable to the notes file; nothing is invented."
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One memo for the meeting, named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-e4-s2-1792698851/deliverables
    budget: 15
    locked: false
