mission: >
  Each week, turn the user's notes of one team meeting into a short markdown memo that says what the team decided and who does what. Written for the user, from the notes files only.
needs:
  kind: writing
  scope: "A memo for ONE weekly team meeting, named by the notes file in the request: decisions made and action items (who does what, by when). Nothing from other meetings and nothing outside the notes."
  inputs:
    - /tmp/hirearchy-e7-s3-1792916437/notes
  quality_bar: Every statement comes from the named notes file; nothing is invented; every commitment someone made, including informal ones in prose, is in the action table.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        template: writer
        model: cheap
        tools: [read]
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One markdown memo of the decisions and action items of one weekly meeting, from the notes file for that meeting.
    inputs:
      - name: notes_file
        description: File name of the meeting notes in the notes folder, for example 2026-10-26.md
        required: true
    acceptance:
      - Covers only the meeting in the requested notes file, and nothing from other files.
      - At most 400 words as counted by read, tables included.
      - The memo has a Decisions section, an Action items section and an Open items section.
      - Every decision in the notes, including ones agreed only in conversation, is listed once, one line each; no decision that is not in the notes appears.
      - "Action items are a markdown table with the columns exactly Owner | Action | Due, and every commitment someone made in the notes is a row, including informal ones stated in prose, each with one named owner."
      - Every Due value is an ISO date (YYYY-MM-DD) or the word none. A relative or vague deadline is converted to an ISO date, using the meeting date in the notes, when the notes make that date clear; otherwise Due is none.
      - Nothing in the memo is missing from or contradicts the notes file; open items are limited to points the notes leave unresolved.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo named memo-<meeting date>.md, for example memo-2026-10-19.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-e7-s3-1792916437/deliverables
    budget: 12
    locked: false
