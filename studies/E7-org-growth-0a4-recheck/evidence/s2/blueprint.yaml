mission: >
  Every week, turn the platform team's meeting notes (one markdown file per meeting) into a short memo that states what the team decided and who does what by when.
needs:
  kind: writing
  scope: "One memo per request, from the one meeting-notes file named in the request: the decisions made and the action items with owner, action and due date. Nothing from other files or from outside the notes."
  inputs:
    - /tmp/hirearchy-e7-s2-1792914064/notes
  quality_bar: Every statement comes from the named notes file; nothing is added that the notes do not say.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer, model: strong}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One short markdown memo (decisions and action items) from one meeting-notes file.
    inputs:
      - name: notes_file
        description: File name of the meeting notes in the notes folder, e.g. 2026-10-19.md
        required: true
    acceptance:
      - "The memo covers only the meeting in the named notes file."
      - "Every decision stated in the notes file appears in the memo's Decisions section, and no decision appears that the notes do not state."
      - "Every commitment in the notes file appears as a row in the Actions table, including informal ones said in passing without an ACTION label (anything a person said they would do), each with the person who committed to it as Owner."
      - "Actions are a markdown table with exactly the columns Owner | Action | Due."
      - "Due is an ISO date (YYYY-MM-DD) when the notes state a date or give a deadline that can be resolved from the meeting date (for example 'before Friday'); otherwise Due is 'none'."
      - "At most 400 words."
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo with a Decisions section (bulleted list) and an Actions section (table Owner | Action | Due).
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-e7-s2-1792914064/deliverables
    budget: 12
    locked: false
