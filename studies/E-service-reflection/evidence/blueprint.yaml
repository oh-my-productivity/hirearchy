mission: >
  Turn the user's notes from each weekly team meeting into a short memo of what was decided and who does what.
  The notes are read-only, one file per meeting; the memo goes to the user as a markdown file.
needs:
  kind: writing
  scope: "One short memo per request, from exactly one meeting notes file: the decisions made and the action items (owner, action, due date). Nothing else from the notes, no other files, no web."
  inputs:
    - /tmp/orgmcp-e-1792289694/notes
  quality_bar: Every statement comes from the named notes file; nothing is invented; where the notes are silent (owner, date) the memo says so.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 12
  models: {cheap: claude-haiku-4.5, strong: claude-sonnet-4.6}
  model_policy: cheap drafting, strong lead and strong review
  review: true
  approval: Plan first; each memo request within the per-request budget counts as approved; ask before any spend beyond it.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        role: Memo writer
        model: cheap
        tools: [read]
        charter: >
          Read the one meeting notes file named in the task (never change it) and write the memo in your own folder.
          Use only what the notes say. List every decision and every action item; do not add, merge or drop any.
          Where the notes give no owner write "owner not stated"; where they give no date write "none".
          Convert relative dates (for example "by Friday") to ISO dates using the meeting date in the file name.
          Keep to the word limit.
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-memo
    owner: lead
    description: One short memo (decisions and action items) from one meeting notes file.
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, for example 2026-10-19.md
        required: true
    acceptance:
      - Uses only the notes file named in the request and nothing else.
      - The memo is markdown with at most 400 words as counted by read.
      - It has a section titled "Decisions" that lists every decision stated in the notes file and no decision that is not in it.
      - It has a section titled "Action items" containing a markdown table with exactly the columns Owner | Action | Due, with one row for every action item in the notes file and no row that is not in it.
      - Every Due cell is an ISO date (YYYY-MM-DD) or the word none; a relative date in the notes is converted to ISO using the meeting date in the file name.
      - Where the notes name no owner, the Owner cell says "owner not stated".
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), checked against the notes file, and the writer applied every required change."
    deliverable:
      description: One markdown memo named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/orgmcp-e-1792289694/deliverables
    budget: 12
    locked: false
