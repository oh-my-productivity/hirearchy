mission: >
  Every week, turn the user's notes from the platform team meeting into a short memo that says what was decided and who does what, using only the notes.
needs:
  kind: writing
  scope: "For one meeting's notes file: the decisions taken and the action items (who does what, by when). Everything else in the notes (discussion, background) is left out."
  inputs:
    - /tmp/hirearchy-p1-I2-1793142034/notes
  quality_bar: Every decision and every commitment in the notes appears in the memo, including informal ones said in prose; nothing appears that is not in the notes.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One memo of decisions and action items from one meeting's notes file.
    inputs:
      - name: meeting_file
        description: File name of the meeting notes in the notes folder, e.g. 2026-10-05.md
        required: true
    acceptance:
      - The memo is based on the requested notes file only.
      - At most 400 words as counted by read.
      - "The memo has a section titled \"Decisions\" with one bullet for every decision stated in the notes, and a section titled \"Actions\" containing a markdown table with exactly the columns Owner | Action | Due; it has no other sections besides a title that names the meeting date."
      - "The Actions table has one row for every commitment in the notes, including informal ones said in prose (for example 'X said he'd do Y'), and no row for anything nobody committed to."
      - "Due is an ISO date (YYYY-MM-DD). A relative deadline such as 'by Friday' is converted to a date using the meeting date when the notes make the date clear. Due is 'none' when the notes give no date or say none."
      - Every decision and action is traceable to the notes, and nothing is invented.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo for the meeting, named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-p1-I2-1793142034/deliverables
    budget: 12
    locked: false
task:
  service: weekly-meeting-memo
  inputs:
    meeting_file: 2026-10-05.md
  title: Memo for the 2026-10-05 platform team meeting
