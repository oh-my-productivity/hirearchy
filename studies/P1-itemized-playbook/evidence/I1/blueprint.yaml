mission: >
  Each week, after the platform team's weekly meeting, turn the meeting notes into a short memo that says what was decided and who does what, using the words of the notes.
needs:
  kind: writing
  scope: "One memo per meeting, from that meeting's notes file only: the decisions, and every commitment (who does what, by when), including informal ones stated in prose. Things only discussed and not decided are left out."
  inputs:
    - /tmp/hirearchy-p1-I1-1793136275/notes
  quality_bar: Every statement comes from the notes file; wording follows the notes; nothing is invented.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One memo (decisions and action table) from one weekly meeting's notes file.
    inputs:
      - name: notes_file
        description: File name of the meeting notes in the notes folder, for example 2026-11-16.md
        required: true
    acceptance:
      - Covers only the meeting in the requested notes file.
      - The memo is markdown and has at most 400 words as counted by read.
      - Every decision stated in the notes is listed under a heading "Decisions".
      - Every commitment in the notes, including informal ones stated in prose (for example "X said he would ..."), is one row of a table under a heading "Actions".
      - The table columns are exactly Owner | Action | Due.
      - Due is an ISO date (YYYY-MM-DD) or "none". A relative date such as "by Friday" is converted to an ISO date using the meeting date only when the notes make it clear; if there is no date or it is not clear, Due is "none".
      - Decisions and actions use the words of the notes, and nothing appears that is not in the notes.
      - Topics that were only discussed and not decided are not listed.
      - The memo names the meeting date and the people present.
      - The memo gives the next meeting date when the notes give one.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo per meeting, named memo-<notes file name>.md (for example memo-2026-11-16.md).
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-p1-I1-1793136275/deliverables
    budget: 12
    locked: false
