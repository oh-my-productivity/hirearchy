mission: >
  Every week, turn the user's notes from the weekly team meeting into a short memo that states what was decided and who does what by when, using only the notes file for that meeting.
needs:
  kind: writing
  scope: "One memo per meeting, from one notes file: the decisions taken and the action items (who does what, by when), including commitments made informally in prose. Nothing else (no attendee list, no summary, no discussion recap)."
  inputs:
    - /tmp/hirearchy-p1-F1-1793129193/notes
  quality_bar: Every statement comes from the notes file; where the notes are silent about an owner or a date, the memo says 'none' rather than guessing.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        template: writer
        model: strong
        tools: [read]
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-memo
    owner: lead
    description: One memo of decisions and action items from one weekly meeting notes file
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, e.g. 2026-10-05.md
        required: true
    acceptance:
      - "The memo is markdown with a one-line title containing the meeting date, then exactly two sections titled 'Decisions' and 'Action items', and nothing else."
      - "At most 400 words as counted by read, table included."
      - "Every decision in the notes file appears under 'Decisions', including decisions stated informally in prose, and no decision that is not in the notes appears."
      - "Every commitment in the notes file appears as one row of the action items table, including commitments made informally in prose (for example 'X said he would ...'), and no row is invented."
      - "The action items are a markdown table with exactly the columns Owner | Action | Due, and each row has exactly one owner, named as in the notes."
      - "Due is an ISO date (YYYY-MM-DD) when the notes give a date or make it clear from the meeting date (for example 'by Friday' becomes the date of that Friday); otherwise Due is 'none', and 'none' is also used when the notes say no date was set."
      - "Every statement in the memo is traceable to the named notes file and to no other file."
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-p1-F1-1793129193/deliverables
    budget: 12
    locked: false
task:
  service: weekly-memo
  inputs:
    notes_file: 2026-10-05.md
  title: Memo for the 2026-10-05 weekly meeting
