mission: >
  Every week, turn the notes of one platform-team meeting into a short memo that says what was decided and who does what by when. One extra one-off job: a one-page action list for the ops team from the 5 October 2026 notes.
needs:
  kind: writing
  scope: "A one-off, one-page action list for the ops team from the notes of the 5 October 2026 platform team weekly (2026-10-05.md): every action item in those notes, each with its owner and due date. Nothing else from the meeting."
  inputs:
    - /tmp/hirearchy-p2/C1-1793280632/notes
  quality_bar: Every statement comes from 2026-10-05.md, in the notes' own words; where the file is silent (for example no date), Due is none.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 8
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: false
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        template: writer
        model: cheap
        tools: [read]
task:
  to: lead
  title: One-page action list for the ops team from the 5 October 2026 notes
  goal: >
    Read /tmp/hirearchy-p2/C1-1793280632/notes/2026-10-05.md and write a one-page action list for the ops team as a markdown file named action-list-2026-10-05.md: a short title with the meeting date, then one table with the columns Owner | Action | Due, with one row for every action item in the notes, including informal ones written in prose. Use the notes' own words. Due dates in ISO format; the client confirmed Sam's "before Friday" is 2026-10-09 and Marta's "for Oct 14" is 2026-10-14; where the notes give no date, Due is none. No summary and no decisions section.
  acceptance:
    - Uses only the meeting in 2026-10-05.md.
    - Has a short title with the meeting date, then one markdown table with the columns Owner | Action | Due, and nothing else (no summary, no decisions section).
    - The table has one row for every action item in the notes, including informal ones written in prose (n of m with n = m in the lead's check against the notes), worded as in the notes.
    - Every row has an owner, an action and a due date; Due is an ISO date (YYYY-MM-DD), or none when the notes give no date. Sam's flaky CI is 2026-10-09 and Marta's on-call training room is 2026-10-14.
    - At most 250 words as counted by read.
    - Nothing appears that is not in the notes file.
