mission: >
  Every week, after the team meeting, turn the meeting notes into a short memo that says what was decided and who does what, for the team lead.
needs:
  kind: writing
  scope: "One memo per meeting, from the one notes file named in the request: the decisions made and the action items (who does what, by when). Nothing from other meetings or outside the notes."
  inputs:
    - /tmp/hirearchy-e6-s3-1792861552/notes
  quality_bar: Every statement comes from the notes file; nothing is invented.
  sources: Only the files in the notes folder; no web.
  budget_runs: 16
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-memo
    owner: lead
    description: One short markdown memo (decisions and action-item table) from one meeting notes file
    inputs:
      - name: notes_file
        description: File name of the meeting notes in the notes folder, for example 2026-10-05.md
        required: true
    acceptance:
      - Covers only the meeting in the named notes file, and nothing from other files.
      - At most 400 words as counted by read.
      - 'Has a section titled "Decisions" that lists every firm decision made in the meeting; items that were discussed but left open are not listed as decisions.'
      - 'Has a section titled "Action items" that is a markdown table with exactly the columns Owner | Action | Due.'
      - 'The table has one row for every commitment in the notes, including informal ones stated in prose (for example "X offered to ..." or "X said he would ...") and those labelled ACTION.'
      - 'Every Due value is an ISO date (YYYY-MM-DD) or the word none. A vague or relative deadline (for example "next week", "by Friday") is turned into a date when the notes make it clear, otherwise it is none.'
      - Every decision and every table row is traceable to the notes file, and nothing is invented.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo for the requested meeting
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-e6-s3-1792861552/deliverables
    budget: 16
    locked: false
task:
  service: weekly-memo
  inputs:
    notes_file: 2026-10-05.md
  title: Memo for the meeting of 2026-10-05
