mission: >
  Turn the notes of one weekly team meeting into a short markdown memo that says what was decided and who does what,
  for the meeting's attendees. Work is requested once per meeting, naming the notes file.
needs:
  kind: writing
  scope: "For the one named notes file: the decisions taken and the action items (who does what, by when). Anything else in the notes (discussion, background) is left out."
  inputs:
    - /tmp/hirearchy-e6-s1-1792855848/notes
  quality_bar: Every decision and every commitment in the named notes file is in the memo, including informal ones said in prose; nothing is invented.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer, model: strong, tools: [read]}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-memo
    owner: lead
    description: One memo with the decisions and the action items of one weekly meeting, from its notes file.
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, e.g. 2026-10-19.md
        required: true
    acceptance:
      - The memo is based only on the named notes file and covers only that meeting.
      - At most 400 words as counted by read.
      - Every decision taken in the meeting is listed in a section titled "Decisions", and nothing that was not decided is listed there.
      - Every action item is in one markdown table with exactly the columns Owner | Action | Due. This includes every commitment, also informal ones said in prose (someone said they would do something), not only items marked ACTION.
      - The Due column holds only an ISO date (YYYY-MM-DD) or the word none. A date is given only when the notes or the meeting date fix exactly one calendar day (for example, a relative date such as "by end of next week" is turned into a date only if it fixes one day); otherwise Due is none.
      - Every Owner is a person named in the notes, and every Action and Due value matches the notes.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo for the meeting, named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-e6-s1-1792855848/deliverables
    budget: 12
    locked: false
