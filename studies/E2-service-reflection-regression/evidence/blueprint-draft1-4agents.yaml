mission: >
  Each week, turn the user's notes from one team meeting into a short memo stating what was decided and who does what,
  for the user's platform team. Works only from the user's own notes files.
needs:
  kind: writing
  scope: "One memo per request, from one named notes file: the decisions made and the action items (who does what, by when), including informal commitments stated in prose. Nothing from other meetings."
  inputs:
    - /tmp/orgmcp-e2-1792295253/notes
  quality_bar: Every statement comes from the requested notes file; where the notes are silent or unclear (for example an owner or a date), the memo says so.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 12
  models: {cheap: claude-haiku-4.5, strong: claude-sonnet-4.6}
  model_policy: cheap drafting, strong lead and strong review
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: reader
        role: Reader of the meeting notes
        model: cheap
        tools: [read]
        charter: >
          Read only the notes file named in the request, from the input folder. List every decision and every
          commitment of the form "someone will do something", whether or not it is labelled ACTION, including informal
          ones stated in prose. For each commitment give the owner, the action and the due date as the notes state it
          (or resolve it to an ISO date only if the notes make it unambiguous), with the quoted sentence it comes from.
          Note every place where an owner or date is missing or unclear. Never change the input files.
      - {name: writer, template: writer, model: cheap}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: meeting-memo
    owner: lead
    description: One short memo of the decisions and the who-does-what from one weekly meeting's notes file
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, for example 2026-10-19.md
        required: true
    acceptance:
      - The memo is based only on the requested notes file and covers that meeting only.
      - At most 400 words as counted by read.
      - Format is markdown with a section "Decisions" and a section "Action items".
      - "The Decisions section lists every decision stated in the notes file, each in one line, and no decision that is not in the notes."
      - "The Action items section is a markdown table with exactly the columns Owner | Action | Due, with one row for every commitment in the notes file, including informal ones stated in prose (for example 'I'll sort it out'); no row for something nobody committed to."
      - "Every Due value is an ISO date (YYYY-MM-DD) or the word none when the notes give no date; a date is never invented, and an owner or date that the notes leave unclear is listed in a final section titled 'Open questions'."
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m) and every decision and commitment in the notes file checked against the memo (n of m, n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo named after the meeting notes file (for example 2026-10-19.md)
      format: markdown
      max_words: 400
      path: /tmp/orgmcp-e2-1792295253/deliverables
    budget: 12
    locked: false
