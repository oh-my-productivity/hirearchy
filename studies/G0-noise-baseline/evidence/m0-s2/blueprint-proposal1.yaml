mission: >
  Turn the notes of the weekly platform team meeting into a short memo for the team lead: what was decided and who does what by when. The team reads only the user's meeting notes.
needs:
  kind: writing
  scope: "One memo per request, from the one notes file named in the request: the decisions made in that meeting and the action items (owner, action, due date). Nothing from other meetings, nothing invented."
  inputs:
    - /tmp/hirearchy-g0-m0-s2-1792995184/notes
  quality_bar: Every decision and action comes from the named notes file; nothing is missing and nothing is added.
  sources: Only the files in needs.inputs; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - {name: writer, template: writer}
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One markdown memo with the decisions and the action-item table for one weekly meeting
    inputs:
      - name: notes_file
        description: File name of the meeting notes inside the notes folder, for example 2026-10-05.md
        required: true
    acceptance:
      - Covers only the meeting in the requested notes file and nothing else.
      - At most 400 words as counted by read.
      - "Has a section titled Decisions that lists every decision the notes record as made (decided or agreed), one line each, and no item that is not a decision."
      - "Has a section titled Actions with a markdown table whose columns are exactly Owner | Action | Due."
      - "The table has one row for every commitment in the notes, including informal ones stated in prose (for example someone saying they will look into something), not only items labelled ACTION."
      - "Due is an ISO date (YYYY-MM-DD) when the notes give a date, or a deadline that resolves to one from the meeting date (a named weekday means that weekday of the meeting's week; the next meeting means the date the notes give for it). Due is 'none' when the notes give no date, say no hard date, or give only a loose period such as 'this week'."
      - Every decision and every table row is traceable to the notes file; no owner, action or date is invented.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo named memo-<meeting date>.md
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-g0-m0-s2-1792995184/deliverables
    budget: 12
    locked: false
task:
  service: weekly-meeting-memo
  inputs:
    notes_file: 2026-10-05.md
  title: Memo for the 2026-10-05 weekly meeting
