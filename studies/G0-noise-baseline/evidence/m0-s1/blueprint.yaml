mission: >
  Turn the notes of the weekly Platform team meeting into a short memo after each meeting: what was decided and who does what.
  The notes are the user's own files; the memo goes to the user.
needs:
  kind: writing
  scope: "One memo per request, covering only the meeting in the requested notes file: the decisions made and who does what (every commitment, including informal ones said in passing). Nothing else."
  inputs:
    - /tmp/hirearchy-g0-m0-s1-1792990299/notes
  quality_bar: Every statement comes from the requested notes file; nothing is added, nothing in scope is left out.
  sources: Only the files in the notes folder; no web.
  budget_runs: 12
  models: {cheap: claude-sonnet-5.5, strong: claude-sonnet-5.5}
  model_policy: one model for all
  review: true
  approval: Plan first; ask before any spend beyond the budget.
  progress: One line when I ask.
agents:
  - name: lead
    template: manager
    model: strong
    children:
      - name: writer
        template: writer
        model: cheap
        tools: [read]
      - name: reviewer
        template: reviewer
        model: strong
        tools: [read]
services:
  - name: weekly-meeting-memo
    owner: lead
    description: One memo from one weekly meeting notes file - what was decided and who does what.
    inputs:
      - name: notes_file
        description: File name of the meeting notes in the notes folder, for example 2026-10-05.md
        required: true
    acceptance:
      - Covers only the meeting in the requested notes file.
      - At most 400 words as counted by read.
      - "Markdown with exactly these sections: Decisions, Action items, Open or tentative items."
      - Every decision recorded in the notes file appears under Decisions.
      - "Every commitment in the notes file appears as a row of the Action items table: the explicit ACTION lines and also anything a person said they would do, including informal ones said in prose."
      - "The Action items table has exactly the columns Owner | Action | Due. Due is an ISO date (YYYY-MM-DD), or 'none' when the notes give no date."
      - A vague deadline (for example 'before Friday' or 'by end of next week') is turned into an ISO date only when the notes make the date clear from the meeting date; otherwise Due is 'none'.
      - A commitment the notes word as hedged (for example 'will probably') is marked '(tentative)' in its Action cell. Open or tentative items lists anything unresolved or unclear in the notes, or says 'none'.
      - Nothing appears that is not in the notes file, and names are spelled as in the notes.
      - "The reviewer's report shows every criterion met (criteria met: n of m with n = m), and the writer applied every required change."
    deliverable:
      description: One markdown memo named memo-<meeting date>.md (for example memo-2026-10-05.md)
      format: markdown
      max_words: 400
      path: /tmp/hirearchy-g0-m0-s1-1792990299/deliverables
    budget: 12
    locked: false
task:
  service: weekly-meeting-memo
  inputs:
    notes_file: 2026-10-05.md
  title: Memo for the 5 October 2026 meeting
