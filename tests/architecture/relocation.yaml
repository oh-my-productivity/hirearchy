# Manifest of the relocation of tests/test_*.py (ARCHITECTURE.md 7.3, step E0). Source of truth; see tools/relocate_tests.py.
#
# destinations -> sources -> the tests that move there (`name`, or `name: n` when pytest collects n items for it: parametrize).
# Every test of every tests/test_*.py is listed exactly once. The rationale of a destination is the comment above it.
# `uv run python tools/relocate_tests.py plan` checks the manifest; `apply --group X` / `prune --group X` move/remove the tests of a group.
# A destination belongs to exactly one E1 step (group) by its package (see `groups`); a destination that exists already is extended.
version: 1

groups:
  # E1-a
  a: [kernel, agents, mail, runs, eligibility, strays, traces, delivery, settings, locator, snapshots, bootstrap, upgrade, skill, templates, prompts]
  # E1-b
  b: [access, orgfiles, budget, hierarchy, dispatch, services, reflection, overview]
  # E1-c
  c: [health, review, stalls, attention, daemon, progress, observability, kiro, processes, eventlog, telemetry]
  # E1-d
  d: [blueprint]
  # E1-e
  e: [scheduler, cli, tests/e2e, tests/meta, tests/architecture]
  # E1-f (split from E1-e by the manager to balance the parallel wave)
  f: [mcp_server, dashboard, dashdata]

